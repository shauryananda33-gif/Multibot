name: Python CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Import runtime and database adapter
        run: python -c "import main, supabase_db"
      - name: Run test suite
        run: pytest
