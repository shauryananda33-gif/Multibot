name: Python CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multibot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d multibot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MULTIBOT_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/multibot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Import runtime and database adapter
        run: python -c "import main, supabase_db"
      - name: Run test suite
        run: pytest
      - name: Run real PostgreSQL migration and adapter integration tests
        run: pytest -q tests/test_postgres_migrations.py
