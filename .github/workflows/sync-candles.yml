name: Sync Candle CSVs

on:
  schedule:
    # Daily after US & global close (23:15 UTC = 04:45 IST)
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Update candle CSV baselines
        run: python tools/sync_candle_csvs.py
      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candles
          if git diff --cached --quiet; then
            echo "No candle CSV changes to commit."
          else
            git commit -m "chore: refresh historical candle CSVs"
            git push
          fi
