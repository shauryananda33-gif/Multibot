services:
  - type: web
    name: Multibot
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.lock
    startCommand: python3 main.py
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_DB_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_API_TOKEN
        sync: false
      - key: DASHBOARD_URL
        value: https://multibot-3hsb.onrender.com/dashboard
      - key: ARCHITECTURE_URL
        value: https://multibot-3hsb.onrender.com/architecture

# The existing Render web service serves both the dashboard and API.
# No external static host or API proxy is required.
# Keep the service warm using the existing external cron job:
#   GET https://multibot-3hsb.onrender.com/ping
# The endpoint is intentionally lightweight and does not start a scan or
# mutate trading state.
